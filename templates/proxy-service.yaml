apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-proxy
  namespace: {{ .Values.namespace }}
  labels:
  {{- include "dspace.commonLabels" . | nindent 4 }}
  {{- include "dspace.componentLabel" "proxy" | nindent 4 }}
spec:
  ports:
    - name: httpd-port
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app: {{ .Release.Name }}-proxy
  type: ClusterIP
