{{- if .Values.iiifEnabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-iiif
  namespace: {{ .Values.namespace }}
  labels:
  {{- include "dspace.commonLabels" . | nindent 4 }}
  {{- include "dspace.componentLabel" "iiif" | nindent 4 }}
spec:
  ports:
    - name: iiif-port
      port: 8182
      protocol: TCP
      targetPort: 8182
  selector:
    app: {{ .Release.Name }}-iiif
  type: ClusterIP
{{- end -}}
