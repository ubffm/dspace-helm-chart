apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Values.namespace }}
  labels:
  {{- include "dspace.commonLabels" . | nindent 4 }}
  {{- include "dspace.componentLabel" "backend" | nindent 4 }}
spec:
  ports:
    - name: dspace-backend-port
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: {{ .Release.Name }}-backend
  type: ClusterIP
