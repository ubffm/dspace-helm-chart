apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
  {{- include "dspace.commonLabels" . | nindent 4 }}
  {{- include "dspace.componentLabel" "frontend" | nindent 4 }}
spec:
  ports:
    - name: dspace-frontend-port
      port: 4000
      protocol: TCP
      targetPort: 4000
  selector:
    app: {{ .Release.Name }}-frontend
  type: ClusterIP
