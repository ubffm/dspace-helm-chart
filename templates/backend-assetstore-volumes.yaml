{{- range .Values.backendAssetstores }}
{{- if not .existingPvcName }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Release.Name }}-backend-{{ .volumeName }}
  namespace: {{ $.Values.namespace }}
  labels:
  {{- include "dspace.commonLabels" $ | nindent 4 }}
  {{- include "dspace.componentLabel" "backend" | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .storageClass }}
  resources:
    requests:
      storage: {{ .storageSize }}
{{- end -}}
{{- end -}}
