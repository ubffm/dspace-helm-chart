{{- if not .Values.dbUrl }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-database
  namespace: {{ .Values.namespace }}
  labels:
  {{- include "dspace.commonLabels" . | nindent 4 }}
  {{- include "dspace.componentLabel" "database" | nindent 4 }}
spec:
  ports:
    - name: dspace-database-port
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    app: {{ .Release.Name }}-database
  type: ClusterIP
{{- end -}}
