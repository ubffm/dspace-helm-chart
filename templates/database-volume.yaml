{{- if not (or .Values.dbUrl .Values.dbExistingPvcName) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-database
  namespace: {{ .Values.namespace }}
  labels:
  {{- include "dspace.commonLabels" . | nindent 4 }}
  {{- include "dspace.componentLabel" "database" | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.dbPvcStorageClass }}
  resources:
    requests:
      storage: {{ .Values.dbPvcSize }}
{{- end -}}
