{{- if not (or .Values.solrUrl .Values.solrExistingPvcName) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-solr
  namespace: {{ .Values.namespace }}
  labels:
  {{- include "dspace.commonLabels" . | nindent 4 }}
  {{- include "dspace.componentLabel" "solr" | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.solrPvcStorageClass }}
  resources:
    requests:
      storage: {{ .Values.solrPvcSize }}
{{- end -}}
