apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-proxy
  namespace: {{ .Values.namespace }}
  labels:
  {{- include "dspace.commonLabels" . | nindent 4 }}
  {{- include "dspace.componentLabel" "proxy" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-proxy
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-proxy
    spec:
      containers:
        - name: proxy-container
          image: {{ .Values.proxyImageName }}:{{ .Values.proxyImageVersion }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: httpd-port
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/local/apache2/conf/httpd.conf
              name: {{ .Release.Name }}-proxy-volume
              subPath: httpd.conf
      volumes:
        - configMap:
            defaultMode: 420
            name: {{ .Release.Name }}-proxy-configmap
          name: {{ .Release.Name }}-proxy-volume
      {{- include "dspace.clusterTolerations" . | nindent 6 -}}
